binding:
  preferTargetInfo: true
  targetType:
    - type
    - resourceType
configuration:
  AZURE_PARAMETER_FILE_EXPANSION: true
  # Expand through the bicepparam only. A standalone expansion of main.bicep or a module has no
  # parameter values, so PSRule fails with "parameter ... not set" and the plan stage fails. The
  # pipeline scans the whole repository, which the pathIgnore below did not stop (it does not
  # match modules/x.bicep). Bicepparam expansion builds the template together with its values.
  AZURE_BICEP_FILE_EXPANSION: false
  AZURE_BICEP_PARAMS_FILE_EXPANSION: true
  # 60, not network's 30: this template expands three local modules plus AVM, and timed out at 30
  # on 1 of 5 local runs.
  AZURE_BICEP_FILE_EXPANSION_TIMEOUT: 60
execution:
  unprocessedObject: Ignore
include:
  module:
    - Az.Resources
    - PSRule.Rules.Azure
input:
  pathIgnore:
    - '**/bicepconfig.json'
    - '**/modules/**/*.bicep'
output:
  culture:
    - en-US
  footer: RuleCount
  format: Markdown
  jobSummaryPath: psrule_summary.md
  outcome: Processed
  style: Detect
rule:
  exclude:
    - Azure.Template.Resources
    - Azure.Template.UseDescriptions
    - Azure.Resource.UseTags
    - Azure.NSG.LateralTraversal
    - Azure.VNET.SingleDNS
    - Azure.VNET.PrivateSubnet
    - Azure.Deployment.SecureParameter
    # Key Vault audit logs go to the central workspace through a diagnostic setting that is only
    # deployed once centralLogAnalyticsWorkspaceResourceId is set, which needs a platform grant
    # (README, "Platform grants"). Until then the vault has no audit log: a known gap, not a pass.
    - Azure.KeyVault.Logs
    # PostgreSQL follows the estate standard, which differs from the baseline on purpose.
    # Geo-redundant backup is production-only: modules/data.bicep enables it when environmentCode is
    # 'p', and test stays locally redundant. HA is out of scope estate-wide.
    - Azure.PostgreSQL.GeoRedundantBackup
    - Azure.PostgreSQL.ZoneRedundantHA
    # Azure SQL server auditing is off, as on the other estate SQL servers; monitoring is elsewhere.
    - Azure.SQL.Auditing
    # The registry (deployDelivery) is Standard, single-region, and reached over its public endpoint by
    # the GitHub-hosted runners. Both rules need Premium (and a private endpoint for the export policy).
    - Azure.ACR.GeoReplica
    - Azure.ACR.ExportPolicy
